<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DeutschSpaß - Almanca Öğrenme Oyunu</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        :root {
            --primary-color: #FF6B6B;
            --secondary-color: #4ECDC4;
            --accent-color: #FFD166;
            --background-color: #F7FFF7;
            --text-color: #2D3047;
            --correct-color: #6BCB77;
            --wrong-color: #FF6B6B;
            --card-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
            --transition-speed: 0.3s;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Comic Sans MS', 'Chalkboard SE', 'Marker Felt', sans-serif;
        }

        body {
            background-color: var(--background-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            background-image: url('data:image/svg+xml;utf8,<svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><circle cx="20" cy="20" r="3" fill="%234ECDC4" opacity="0.3"/><circle cx="50" cy="50" r="2" fill="%23FFD166" opacity="0.3"/><circle cx="80" cy="80" r="4" fill="%23FF6B6B" opacity="0.3"/></svg>');
            background-size: 100px 100px;
        }

        .container {
            width: 100%;
            max-width: 800px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
            padding: 20px;
            border-radius: 20px;
            background: linear-gradient(135deg, var(--primary-color), #FF9E7D);
            color: white;
            box-shadow: var(--card-shadow);
            position: relative;
            overflow: hidden;
        }

        header::before {
            content: "";
            position: absolute;
            top: -10px;
            left: -10px;
            right: -10px;
            bottom: -10px;
            background-image: url('data:image/svg+xml;utf8,<svg width="60" height="60" viewBox="0 0 60 60" xmlns="http://www.w3.org/2000/svg"><circle cx="10" cy="10" r="2" fill="white" opacity="0.2"/><circle cx="30" cy="30" r="1.5" fill="white" opacity="0.2"/><circle cx="50" cy="50" r="3" fill="white" opacity="0.2"/></svg>');
            background-size: 60px 60px;
            z-index: 0;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            position: relative;
            z-index: 1;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.2);
        }

        .subtitle {
            font-size: 1.2rem;
            opacity: 0.9;
            position: relative;
            z-index: 1;
        }

        .quiz-container {
            background-color: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: var(--card-shadow);
            margin-bottom: 30px;
            transition: transform var(--transition-speed);
            position: relative;
            border: 3px solid var(--accent-color);
        }

        .quiz-container:hover {
            transform: translateY(-5px);
        }

        .question-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .question-number {
            font-size: 1.2rem;
            font-weight: bold;
            color: white;
            background-color: var(--primary-color);
            padding: 8px 15px;
            border-radius: 20px;
            box-shadow: 2px 2px 5px rgba(0, 0, 0, 0.1);
        }

        .language-badge {
            font-size: 1rem;
            padding: 8px 15px;
            border-radius: 15px;
            font-weight: bold;
            box-shadow: 2px 2px 5px rgba(0, 0, 0, 0.1);
        }

        .german {
            background-color: #FFD166;
            color: #806600;
        }

        .turkish {
            background-color: #4ECDC4;
            color: white;
        }

        .question-text {
            font-size: 1.8rem;
            margin-bottom: 25px;
            line-height: 1.4;
            text-align: center;
            padding: 15px;
            background-color: #F8F9FA;
            border-radius: 15px;
            border: 2px dashed var(--secondary-color);
            animation: pulse 2s infinite;
            position: relative;
        }

        @keyframes pulse {
            0% {
                box-shadow: 0 0 0 0 rgba(78, 205, 196, 0.4);
            }
            70% {
                box-shadow: 0 0 0 10px rgba(78, 205, 196, 0);
            }
            100% {
                box-shadow: 0 0 0 0 rgba(78, 205, 196, 0);
            }
        }

        .audio-btn {
            background-color: var(--accent-color);
            color: #806600;
            border: none;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            margin-left: 10px;
            transition: all var(--transition-speed);
            vertical-align: middle;
            box-shadow: 2px 2px 5px rgba(0, 0, 0, 0.2);
            font-size: 1rem;
        }

        .audio-btn:hover {
            background-color: #FFE066;
            transform: scale(1.1) rotate(10deg);
        }

        .audio-btn:active {
            transform: scale(0.95);
        }

        /* Yeni eklenen soru işareti butonu stili */
        .tooltip-btn {
            background-color: #9370DB;
            color: white;
            border: none;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            margin-left: 10px;
            transition: all var(--transition-speed);
            vertical-align: middle;
            box-shadow: 2px 2px 5px rgba(0, 0, 0, 0.2);
            font-size: 1rem;
        }

        .tooltip-btn:hover {
            background-color: #8A2BE2;
            transform: scale(1.1) rotate(10deg);
        }

        .tooltip-btn:active {
            transform: scale(0.95);
        }

        /* Konuşma balonu stili */
        .speech-bubble {
            position: absolute;
            background-color: #9370DB;
            color: white;
            padding: 15px;
            border-radius: 15px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
            z-index: 10;
            max-width: 90%;
            font-size: 1.2rem;
            top: 100%;
            left: 50%;
            transform: translateX(-50%);
            margin-top: 10px;
            display: none;
            animation: fadeIn 0.3s;
            text-align: center;
        }

        .speech-bubble::before {
            content: '';
            position: absolute;
            top: -10px;
            left: 50%;
            transform: translateX(-50%);
            border-width: 0 10px 10px 10px;
            border-style: solid;
            border-color: transparent transparent #9370DB transparent;
        }

        /* Seçenekler için konuşma balonu düzeltmesi */
        .option .speech-bubble {
            position: absolute;
            top: -80px; /* Konuşma balonunu seçeneğin üstünde göster */
            left: 50%;
            transform: translateX(-50%);
            z-index: 20; /* Daha yüksek z-index değeri */
            width: auto;
            min-width: 200px;
        }

        .option .speech-bubble::before {
            top: auto;
            bottom: -10px;
            border-width: 10px 10px 0 10px;
            border-color: #9370DB transparent transparent transparent;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateX(-50%) translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateX(-50%) translateY(0);
            }
        }

        .options-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .option {
            padding: 15px 20px;
            border: 3px solid #E9ECEF;
            border-radius: 15px;
            cursor: pointer;
            transition: all var(--transition-speed);
            position: relative;
            overflow: visible; /* Konuşma balonunun görünmesi için overflow: visible */
            font-size: 1.2rem;
            background-color: white;
            box-shadow: 2px 2px 5px rgba(0, 0, 0, 0.1);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .option:hover {
            border-color: var(--secondary-color);
            background-color: rgba(78, 205, 196, 0.05);
            transform: translateX(5px);
        }

        .option.selected {
            border-color: var(--secondary-color);
            background-color: rgba(78, 205, 196, 0.1);
        }

        .option.correct {
            border-color: var(--correct-color);
            background-color: rgba(107, 203, 119, 0.1);
        }

        .option.wrong {
            border-color: var(--wrong-color);
            background-color: rgba(255, 107, 107, 0.1);
        }

        .option-content {
            display: flex;
            align-items: center;
            flex: 1;
            position: relative;
        }

        .option-letter {
            display: inline-block;
            width: 40px;
            height: 40px;
            background-color: #E9ECEF;
            border-radius: 50%;
            text-align: center;
            line-height: 40px;
            margin-right: 15px;
            font-weight: bold;
            transition: all var(--transition-speed);
            box-shadow: 1px 1px 3px rgba(0, 0, 0, 0.1);
            flex-shrink: 0;
        }

        .option:hover .option-letter,
        .option.selected .option-letter {
            background-color: var(--secondary-color);
            color: white;
        }

        .option.correct .option-letter {
            background-color: var(--correct-color);
            color: white;
        }

        .option.wrong .option-letter {
            background-color: var(--wrong-color);
            color: white;
        }

        .feedback {
            margin-top: 20px;
            padding: 15px;
            border-radius: 15px;
            text-align: center;
            font-weight: bold;
            display: none;
            font-size: 1.2rem;
            animation: bounceIn 0.5s;
        }

        @keyframes bounceIn {
            0% {
                transform: scale(0.8);
                opacity: 0;
            }
            50% {
                transform: scale(1.1);
            }
            100% {
                transform: scale(1);
                opacity: 1;
            }
        }

        .feedback.correct {
            background-color: rgba(107, 203, 119, 0.2);
            color: #2c7a34;
            border: 2px solid var(--correct-color);
        }

        .feedback.wrong {
            background-color: rgba(255, 107, 107, 0.2);
            color: #c53030;
            border: 2px solid var(--wrong-color);
        }

        .controls {
            display: flex;
            justify-content: space-between;
            margin-top: 30px;
        }

        .btn {
            padding: 12px 25px;
            border: none;
            border-radius: 15px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: all var(--transition-speed);
            box-shadow: 2px 2px 5px rgba(0, 0, 0, 0.2);
        }

        .btn-primary {
            background-color: var(--primary-color);
            color: white;
        }

        .btn-primary:hover {
            background-color: #FF8080;
            transform: translateY(-3px);
        }

        .btn-secondary {
            background-color: var(--secondary-color);
            color: white;
        }

        .btn-secondary:hover {
            background-color: #5FDDCF;
            transform: translateY(-3px);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .progress-container {
            width: 100%;
            height: 15px;
            background-color: #E9ECEF;
            border-radius: 10px;
            margin-bottom: 30px;
            overflow: hidden;
            box-shadow: inset 0 2px 5px rgba(0, 0, 0, 0.1);
        }

        .progress-bar {
            height: 100%;
            background: linear-gradient(to right, var(--primary-color), var(--secondary-color));
            width: 0%;
            transition: width 0.5s ease;
            border-radius: 10px;
        }

        .stats {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
            font-size: 1rem;
        }

        .stat {
            display: flex;
            align-items: center;
            gap: 5px;
            background-color: white;
            padding: 8px 15px;
            border-radius: 15px;
            box-shadow: 2px 2px 5px rgba(0, 0, 0, 0.1);
        }

        .stat-icon {
            color: var(--primary-color);
            font-size: 1.2rem;
        }

        .results {
            background-color: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: var(--card-shadow);
            text-align: center;
            display: none;
            border: 3px solid var(--accent-color);
            position: relative;
            overflow: hidden;
        }

        .results::after {
            content: "";
            position: absolute;
            top: -50px;
            left: -50px;
            width: 100px;
            height: 100px;
            background-color: var(--accent-color);
            opacity: 0.2;
            border-radius: 50%;
            z-index: 0;
        }

        .results::before {
            content: "";
            position: absolute;
            bottom: -50px;
            right: -50px;
            width: 120px;
            height: 120px;
            background-color: var(--primary-color);
            opacity: 0.2;
            border-radius: 50%;
            z-index: 0;
        }

        .results h2 {
            font-size: 2.2rem;
            margin-bottom: 20px;
            color: var(--primary-color);
            position: relative;
            z-index: 1;
        }

        .score-circle {
            width: 180px;
            height: 180px;
            border-radius: 50%;
            background: conic-gradient(var(--primary-color) 0%, var(--secondary-color) 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 30px;
            position: relative;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
            z-index: 1;
        }

        .score-circle::before {
            content: "";
            position: absolute;
            width: 160px;
            height: 160px;
            border-radius: 50%;
            background-color: white;
        }

        .score-text {
            position: relative;
            z-index: 1;
            font-size: 3rem;
            font-weight: bold;
            color: var(--primary-color);
        }

        .results-message {
            font-size: 1.3rem;
            margin-bottom: 30px;
            line-height: 1.6;
            position: relative;
            z-index: 1;
        }

        .restart-btn {
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            color: white;
            padding: 15px 30px;
            border: none;
            border-radius: 15px;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            transition: all var(--transition-speed);
            margin-top: 20px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
            position: relative;
            z-index: 1;
        }

        .restart-btn:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
        }

        .character {
            position: absolute;
            width: 80px;
            height: 80px;
            background-size: contain;
            background-repeat: no-repeat;
            z-index: 2;
        }

        .character.happy {
            background-image: url('data:image/svg+xml;utf8,<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><circle cx="50" cy="50" r="45" fill="%23FFD166"/><circle cx="35" cy="40" r="5" fill="%232D3047"/><circle cx="65" cy="40" r="5" fill="%232D3047"/><path d="M 30 65 Q 50 80 70 65" stroke="%232D3047" stroke-width="3" fill="none"/></svg>');
            top: -40px;
            right: -20px;
            transform: rotate(10deg);
            animation: bounce 2s infinite;
        }

        .character.sad {
            background-image: url('data:image/svg+xml;utf8,<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><circle cx="50" cy="50" r="45" fill="%23FFD166"/><circle cx="35" cy="40" r="5" fill="%232D3047"/><circle cx="65" cy="40" r="5" fill="%232D3047"/><path d="M 30 75 Q 50 60 70 75" stroke="%232D3047" stroke-width="3" fill="none"/></svg>');
            bottom: -40px;
            left: -20px;
            transform: rotate(-10deg);
            display: none;
        }

        @keyframes bounce {
            0%, 100% {
                transform: translateY(0) rotate(10deg);
            }
            50% {
                transform: translateY(-10px) rotate(10deg);
            }
        }

        @media (max-width: 768px) {
            .container {
                padding: 10px;
            }

            h1 {
                font-size: 2rem;
            }

            .question-text {
                font-size: 1.5rem;
            }

            .option {
                padding: 12px 15px;
                font-size: 1.1rem;
            }

            .controls {
                flex-direction: column;
                gap: 15px;
            }

            .btn {
                width: 100%;
            }

            .character {
                width: 60px;
                height: 60px;
            }

            /* Mobil için konuşma balonu ayarları */
            .speech-bubble {
                font-size: 1rem;
                padding: 10px;
                max-width: 95%;
            }
            
            /* Mobil için seçenek konuşma balonu düzeltmesi */
            .option .speech-bubble {
                top: -70px;
                min-width: 150px;
            }
        }

        /* Animations */
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .fade-in {
            animation: fadeIn 0.5s ease forwards;
        }

        .loading {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            width: 100%;
            position: fixed;
            top: 0;
            left: 0;
            background-color: var(--background-color);
            z-index: 1000;
        }

        .spinner {
            width: 60px;
            height: 60px;
            border: 5px solid rgba(255, 107, 107, 0.3);
            border-radius: 50%;
            border-top-color: var(--primary-color);
            animation: spin 1s ease-in-out infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .confetti {
            position: fixed;
            width: 10px;
            height: 10px;
            background-color: #f2d74e;
            opacity: 0;
            z-index: 1000;
        }
    </style>
</head>
<body>
    <div class="loading">
        <div class="spinner"></div>
    </div>

    <div class="container">
        <header>
            <h1>DeutschSpaß</h1>
            <p class="subtitle">Almanca Öğrenme Oyunu</p>
        </header>

        <div class="progress-container">
            <div class="progress-bar" id="progress-bar"></div>
        </div>

        <div class="stats">
            <div class="stat">
                <i class="fas fa-check-circle stat-icon"></i>
                <span>Doğru: <span id="correct-count">0</span></span>
            </div>
            <div class="stat">
                <i class="fas fa-times-circle stat-icon"></i>
                <span>Yanlış: <span id="wrong-count">0</span></span>
            </div>
            <div class="stat">
                <i class="fas fa-question-circle stat-icon"></i>
                <span>Kalan: <span id="remaining-count">60</span></span>
            </div>
        </div>

        <div class="quiz-container fade-in">
            <div class="character happy"></div>
            <div class="character sad"></div>
            <div class="question-header">
                <span class="question-number" id="question-number">Soru 1/60</span>
                <span class="language-badge german" id="language-badge">Almanca</span>
            </div>
            <div class="question-text" id="question-text">
                Wie heißt du?
                <button class="audio-btn" id="question-audio-btn">
                    <i class="fas fa-volume-up"></i>
                </button>
                <button class="tooltip-btn" id="question-tooltip-btn">
                    <i class="fas fa-question"></i>
                </button>
                <div class="speech-bubble" id="question-tooltip">Adın ne?</div>
            </div>
            <div class="options-container" id="options-container">
                <!-- Options will be dynamically added here -->
            </div>
            <div class="feedback" id="feedback"></div>
            <div class="controls">
                <button class="btn btn-secondary" id="prev-btn" disabled>Önceki</button>
                <button class="btn btn-primary" id="next-btn" disabled>Sonraki</button>
            </div>
        </div>

        <div class="results" id="results">
            <h2>Tebrikler!</h2>
            <div class="score-circle">
                <div class="score-text" id="score-text">0%</div>
            </div>
            <p class="results-message" id="results-message">
                Almanca öğrenme oyununu tamamladın! Harika iş çıkardın!
            </p>
            <button class="restart-btn" id="restart-btn">Tekrar Oyna</button>
        </div>
    </div>

    <script>
        // Wait for the page to load
        window.addEventListener('DOMContentLoaded', () => {
            // Hide loading spinner after a short delay
            setTimeout(() => {
                document.querySelector('.loading').style.display = 'none';
            }, 1500);

            // DOM elements
            const questionNumber = document.getElementById('question-number');
            const languageBadge = document.getElementById('language-badge');
            const questionText = document.getElementById('question-text');
            const optionsContainer = document.getElementById('options-container');
            const feedback = document.getElementById('feedback');
            const prevBtn = document.getElementById('prev-btn');
            const nextBtn = document.getElementById('next-btn');
            const progressBar = document.getElementById('progress-bar');
            const correctCount = document.getElementById('correct-count');
            const wrongCount = document.getElementById('wrong-count');
            const remainingCount = document.getElementById('remaining-count');
            const resultsContainer = document.getElementById('results');
            const quizContainer = document.querySelector('.quiz-container');
            const scoreText = document.getElementById('score-text');
            const resultsMessage = document.getElementById('results-message');
            const restartBtn = document.getElementById('restart-btn');
            const happyCharacter = document.querySelector('.character.happy');
            const sadCharacter = document.querySelector('.character.sad');

            // Quiz state
            let currentQuestionIndex = 0;
            let selectedOption = null;
            let userAnswers = [];
            let questionType = 'german_only'; // 'german_only', 'de_to_tr', 'tr_to_de'
            let activeTooltip = null; // Aktif konuşma balonu

            // Türkçe çeviriler
            const translations = {
                // Sorular için çeviriler
                "Wie heißt du?": "Adın ne?",
                "Wer bist du?": "Sen kimsin?",
                "Wie ist dein Name?": "İsmin nedir?",
                "Wie geht es dir?": "Nasılsın?",
                "Wie alt bist du?": "Kaç yaşındasın?",
                "Woher kommst du?": "Nerelisin?",
                "Wo wohnst du?": "Nerede yaşıyorsun?",
                "Was machst du gern?": "Ne yapmaktan hoşlanırsın?",
                "Was machst du am Wochenende?": "Hafta sonu ne yaparsın?",
                "Hörst du gern Musik?": "Müzik dinlemeyi sever misin?",
                "Liest du gern Comics?": "Çizgi roman okumayı sever misin?",
                "Triffst du gern Freunde?": "Arkadaşlarınla buluşmayı sever misin?",
                "Siehst du gern Filme?": "Film izlemeyi sever misin?",

            // Combine and shuffle questions
            allQuestions.push(...germanQuestions, ...bilingualQuestions);
            shuffleArray(allQuestions);
            
            // Initialize the quiz
            loadQuestion();
            updateStats();

            // Function to shuffle array
            function shuffleArray(array) {
                for (let i = array.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [array[i], array[j]] = [array[j], array[i]];
                }
            }

            // Konuşma balonlarını kapatma fonksiyonu
            function closeAllTooltips() {
                const tooltips = document.querySelectorAll('.speech-bubble');
                tooltips.forEach(tooltip => {
                    tooltip.style.display = 'none';
                });
                activeTooltip = null;
            }

            // Sayfa tıklamalarında konuşma balonlarını kapat
            document.addEventListener('click', function(e) {
                // Eğer tıklanan eleman tooltip butonu değilse ve aktif tooltip varsa kapat
                if (!e.target.closest('.tooltip-btn') && activeTooltip) {
                    closeAllTooltips();
                }
            });

            // Load current question
            function loadQuestion() {
                if (currentQuestionIndex >= allQuestions.length) {
                    showResults();
                    return;
                }

                const question = allQuestions[currentQuestionIndex];
                questionType = question.type;
                
                // Update question number
                questionNumber.textContent = `Soru ${currentQuestionIndex + 1}/${allQuestions.length}`;
                
                // Update language badge and question text
                if (questionType === 'german_only') {
                    languageBadge.textContent = 'Almanca';
                    languageBadge.className = 'language-badge german';
                    
                    // Almanca soru için soru işareti butonu ve konuşma balonu ekle
                    const translation = translations[question.question] || "Çeviri bulunamadı";
                    questionText.innerHTML = `
                        ${question.question}
                        <button class="audio-btn" id="question-audio-btn">
                            <i class="fas fa-volume-up"></i>
                        </button>
                        <button class="tooltip-btn" id="question-tooltip-btn">
                            <i class="fas fa-question"></i>
                        </button>
                        <div class="speech-bubble" id="question-tooltip">${translation}</div>
                    `;
                } else if (questionType === 'de_to_tr') {
                    languageBadge.textContent = 'Almanca → Türkçe';
                    languageBadge.className = 'language-badge german';
                    
                    // Almanca-Türkçe sorularda soru işareti butonu ekleme
                    questionText.innerHTML = `
                        ${question.question}
                        <button class="audio-btn" id="question-audio-btn">
                            <i class="fas fa-volume-up"></i>
                        </button>
                        <br><span style="font-size: 0.8em; color: #666;">${question.question_tr}</span>
                    `;
                } else if (questionType === 'tr_to_de') {
                    languageBadge.textContent = 'Türkçe → Almanca';
                    languageBadge.className = 'language-badge turkish';
                    questionText.innerHTML = `
                        ${question.question}
                        <br><span style="font-size: 0.8em; color: #666;">${question.question_tr}</span>
                    `;
                }
                
                // Attach question audio button event listener
                const questionAudioBtn = document.getElementById('question-audio-btn');
                if (questionAudioBtn) {
                    questionAudioBtn.addEventListener('click', () => playAudio(question.question));
                }
                
                // Attach question tooltip button event listener
                const questionTooltipBtn = document.getElementById('question-tooltip-btn');
                const questionTooltip = document.getElementById('question-tooltip');
                if (questionTooltipBtn && questionTooltip) {
                    questionTooltipBtn.addEventListener('click', (e) => {
                        e.stopPropagation();
                        if (questionTooltip.style.display === 'block') {
                            questionTooltip.style.display = 'none';
                            activeTooltip = null;
                        } else {
                            closeAllTooltips();
                            questionTooltip.style.display = 'block';
                            activeTooltip = questionTooltip;
                        }
                    });
                }
                
                // Clear options container
                optionsContainer.innerHTML = '';
                
                // Add options
                const options = [...question.options];
                shuffleArray(options);
                
                options.forEach((option, index) => {
                    const optionElement = document.createElement('div');
                    optionElement.className = 'option';
                    
                    // Check if this is a German answer (for tr_to_de questions or german_only questions)
                    const isGermanAnswer = questionType === 'tr_to_de' || questionType === 'german_only';
                    
                    // Create option content with audio button for German answers
                    if (isGermanAnswer) {
                        // Almanca cevap için soru işareti butonu ve konuşma balonu ekle
                        const translation = translations[option.text] || "Çeviri bulunamadı";
                        const tooltipId = `option-tooltip-${index}`;
                        
                        optionElement.innerHTML = `
                            <div class="option-content">
                                <span class="option-letter">${String.fromCharCode(65 + index)}</span>
                                ${option.text}
                            </div>
                            <div>
                                <button class="audio-btn option-audio-btn" data-text="${option.text}">
                                    <i class="fas fa-volume-up"></i>
                                </button>
                                <button class="tooltip-btn option-tooltip-btn" data-tooltip="${tooltipId}">
                                    <i class="fas fa-question"></i>
                                </button>
                                <div class="speech-bubble" id="${tooltipId}">${translation}</div>
                            </div>
                        `;
                    } else {
                        optionElement.innerHTML = `
                            <div class="option-content">
                                <span class="option-letter">${String.fromCharCode(65 + index)}</span>
                                ${option.text}
                            </div>
                        `;
                    }
                    
                    optionElement.dataset.correct = option.correct;
                    optionElement.addEventListener('click', () => selectOption(optionElement));
                    optionsContainer.appendChild(optionElement);
                });
                
                // Add event listeners to option audio buttons
                const optionAudioBtns = document.querySelectorAll('.option-audio-btn');
                optionAudioBtns.forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        e.stopPropagation(); // Prevent option selection when clicking the audio button
                        playAudio(btn.dataset.text);
                    });
                });
                
                // Add event listeners to option tooltip buttons
                const optionTooltipBtns = document.querySelectorAll('.option-tooltip-btn');
                optionTooltipBtns.forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        e.stopPropagation(); // Prevent option selection when clicking the tooltip button
                        const tooltipId = btn.dataset.tooltip;
                        const tooltip = document.getElementById(tooltipId);
                        
                        if (tooltip.style.display === 'block') {
                            tooltip.style.display = 'none';
                            activeTooltip = null;
                        } else {
                            closeAllTooltips();
                            tooltip.style.display = 'block';
                            activeTooltip = tooltip;
                        }
                    });
                });
                
                // Reset selected option
                selectedOption = null;
                
                // Reset feedback
                feedback.style.display = 'none';
                
                // Update buttons
                prevBtn.disabled = currentQuestionIndex === 0;
                nextBtn.disabled = true;
                
                // Update progress bar
                updateProgress();
                
                // Reset character display
                happyCharacter.style.display = 'block';
                sadCharacter.style.display = 'none';
            }

            // Select an option
            function selectOption(optionElement) {
                // If an answer was already submitted, don't allow changing
                if (feedback.style.display === 'block') return;
                
                // Remove selected class from all options
                const options = optionsContainer.querySelectorAll('.option');
                options.forEach(option => {
                    option.className = 'option';
                });
                
                // Add selected class to clicked option
                optionElement.className = 'option selected';
                
                // Store selected option
                selectedOption = optionElement;
                
                // Enable next button
                nextBtn.disabled = false;
                
                // Check answer
                const isCorrect = optionElement.dataset.correct === 'true';
                
                // Show feedback
                feedback.className = isCorrect ? 'feedback correct' : 'feedback wrong';
                feedback.textContent = isCorrect ? 'Harika! Doğru cevap! 🎉' : 'Üzgünüm, yanlış cevap. 😢';
                feedback.style.display = 'block';
                
                // Show character reaction
                if (isCorrect) {
                    happyCharacter.style.display = 'block';
                    sadCharacter.style.display = 'none';
                    createConfetti();
                } else {
                    happyCharacter.style.display = 'none';
                    sadCharacter.style.display = 'block';
                }
                
                // Highlight correct and wrong answers
                options.forEach(option => {
                    if (option.dataset.correct === 'true') {
                        option.className = 'option correct';
                    } else if (option === selectedOption && !isCorrect) {
                        option.className = 'option wrong';
                    }
                });
                
                // Store user answer
                userAnswers[currentQuestionIndex] = {
                    questionId: allQuestions[currentQuestionIndex].id,
                    isCorrect: isCorrect
                };
                
                // Update stats
                updateStats();
            }

            // Create confetti effect for correct answers
            function createConfetti() {
                const colors = ['#FF6B6B', '#4ECDC4', '#FFD166', '#F7FFF7'];
                
                for (let i = 0; i < 50; i++) {
                    const confetti = document.createElement('div');
                    confetti.className = 'confetti';
                    confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                    confetti.style.left = Math.random() * 100 + 'vw';
                    confetti.style.top = -10 + 'px';
                    confetti.style.width = Math.random() * 10 + 5 + 'px';
                    confetti.style.height = Math.random() * 10 + 5 + 'px';
                    confetti.style.opacity = 1;
                    confetti.style.transform = 'rotate(' + Math.random() * 360 + 'deg)';
                    
                    document.body.appendChild(confetti);
                    
                    const animationDuration = Math.random() * 3 + 2;
                    
                    confetti.animate([
                        { transform: 'translateY(0) rotate(0)', opacity: 1 },
                        { transform: 'translateY(' + (Math.random() * 200 + 400) + 'px) rotate(' + (Math.random() * 360) + 'deg)', opacity: 0 }
                    ], {
                        duration: animationDuration * 1000,
                        easing: 'cubic-bezier(0.25, 1, 0.5, 1)'
                    });
                    
                    setTimeout(() => {
                        document.body.removeChild(confetti);
                    }, animationDuration * 1000);
                }
            }

            // Go to next question
            function nextQuestion() {
                closeAllTooltips();
                currentQuestionIndex++;
                loadQuestion();
            }

            // Go to previous question
            function prevQuestion() {
                closeAllTooltips();
                currentQuestionIndex--;
                loadQuestion();
            }

            // Update progress bar
            function updateProgress() {
                const progress = ((currentQuestionIndex) / allQuestions.length) * 100;
                progressBar.style.width = `${progress}%`;
            }

            // Update statistics
            function updateStats() {
                const correct = userAnswers.filter(answer => answer && answer.isCorrect).length;
                const wrong = userAnswers.filter(answer => answer && !answer.isCorrect).length;
                const remaining = allQuestions.length - correct - wrong;
                
                correctCount.textContent = correct;
                wrongCount.textContent = wrong;
                remainingCount.textContent = remaining;
            }

            // Show results
            function showResults() {
                quizContainer.style.display = 'none';
                resultsContainer.style.display = 'block';
                
                const correct = userAnswers.filter(answer => answer && answer.isCorrect).length;
                const score = Math.round((correct / allQuestions.length) * 100);
                
                scoreText.textContent = `${score}%`;
                
                // Update results message based on score
                if (score >= 90) {
                    resultsMessage.textContent = 'Muhteşem! Almanca konuşmada bir yıldız gibisin! 🌟';
                } else if (score >= 70) {
                    resultsMessage.textContent = 'Çok iyi! Biraz daha pratik yaparak süper olabilirsin! 🚀';
                } else if (score >= 50) {
                    resultsMessage.textContent = 'İyi iş! Daha fazla pratik yapmaya devam et! 💪';
                } else {
                    resultsMessage.textContent = 'Endişelenme, pratik yaparak daha iyi olacaksın! Tekrar dene! 😊';
                }
                
                // Create final confetti celebration
                if (score >= 50) {
                    setTimeout(() => {
                        createConfetti();
                    }, 500);
                }
            }

            // Restart quiz
            function restartQuiz() {
                currentQuestionIndex = 0;
                userAnswers = [];
                shuffleArray(allQuestions);
                
                resultsContainer.style.display = 'none';
                quizContainer.style.display = 'block';
                
                loadQuestion();
                updateStats();
            }

            // Play audio for German text
            function playAudio(text) {
                // Use the Web Speech API for text-to-speech
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'de-DE'; // Set language to German
                speechSynthesis.speak(utterance);
            }

            // Event listeners
            nextBtn.addEventListener('click', nextQuestion);
            prevBtn.addEventListener('click', prevQuestion);
            restartBtn.addEventListener('click', restartQuiz);
        });
    </script>
